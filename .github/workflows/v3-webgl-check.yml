name: Kraken V3 optional WebGL check
on:
  push:
    paths:
      - '.github/workflows/v3-webgl-check.yml'
      - 'tools/v3-webgl-check.cjs'
      - 'docs/app.js'
      - 'docs/kraken-v3-immersive.js'
      - 'docs/index.html'
      - 'docs/styles.css'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'pages build and deployment'
    types:
      - completed
permissions:
  contents: read
jobs:
  webgl:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify current deployed 3D and fallback
        run: node tools/v3-webgl-check.cjs
      - name: Upload screenshots and audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kraken-v3-webgl-evidence
          path: v3-webgl-evidence/
          retention-days: 14
          if-no-files-found: error
