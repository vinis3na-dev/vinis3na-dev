name: Kraken V3 optional WebGL check
on:
  push:
    paths:
      - '.github/workflows/v3-webgl-check.yml'
      - 'tools/v3-webgl-check.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check optional 3D renderer on public Pages
        run: node tools/v3-webgl-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-webgl-screenshot
          path: v3-webgl-public.png
          if-no-files-found: ignore
