name: KRAKEN V3 Pages visual smoke
on:
  push:
    paths:
      - '.github/workflows/v3-pages-smoke.yml'
      - 'tools/v3-pages-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Test published V3 and capture evidence
        run: node tools/v3-pages-smoke.cjs
      - name: Archive screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-v3-pages-browser-evidence
          path: v3-captures/
          if-no-files-found: warn
